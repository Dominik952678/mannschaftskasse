# Push auf main → bauen → zu Cloudflare.
#
# Vier Secrets müssen bei GitHub liegen (Settings → Secrets and variables →
# Actions), siehe README:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Zwei Deploys gleichzeitig würden sich überholen; der neuere gewinnt.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Ohne die beiden Werte baut Vite eine App, die klaglos startet und
      # dann im lokalen Modus läuft — ohne Datenbank, mit dem Dev-Code als
      # Anmeldung. Das fällt erst im Browser auf. Lieber hier abbrechen.
      - name: Supabase-Zugangsdaten prüfen
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" || { echo "::error::Secret VITE_SUPABASE_URL fehlt."; exit 1; }
          test -n "$KEY" || { echo "::error::Secret VITE_SUPABASE_ANON_KEY fehlt."; exit 1; }

      - run: npm run lint

      # `npm run build` ist `tsc -b && vite build` — der Typcheck hängt mit drin.
      - name: Bauen
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Hochladen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
